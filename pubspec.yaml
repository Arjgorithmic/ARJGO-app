name: arjgo
description: "Arjgo — Your skills, seen clearly."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.1

  # Storage
  shared_preferences: ^2.2.3
  path_provider: ^2.1.5

  # Supabase (Auth)
  supabase_flutter: ^2.5.0

  # HTTP/Downloading
  dio: ^5.4.1

  # Typography
  google_fonts: ^6.2.1

  # Image picking / camera
  image_picker: ^1.1.2

  # Markdown parsing (skill.md)
  flutter_markdown: ^0.6.22

  # Utilities
  uuid: ^4.4.0
  intl: ^0.19.0
  archive: ^4.0.9
  file_picker: ^10.3.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/skills/skill.md
    - assets/images/

